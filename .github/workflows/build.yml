name: Build & Update Release

# Builds everything the developer's Dockerfile produces:
#   - kernel + QEMU + rootfs + initramfs (when rootfs/initramfs files change)
#   - kernel + QEMU only (when only Dockerfile/kernel/build-tools change)
# All outputs go to the all-core-file release via gh release upload --clobber.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'podroid_kernel.config'
      - 'gradle.properties'
      - 'build-tools/**'
      - 'build-rootfs/**'
      - 'init-podroid'
      - 'podroid-bridge.c'
      - 'podroid-launcher.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: ver
        run: |
          echo "kernel=$(grep '^podroidKernelVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "qemu=$(grep '^podroidQemuVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # QEMU: Cross-compiled patched QEMU binary
      # Developer's qemu-builder stage — cached after first run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qemu-builder
          load: true
          tags: podroid-qemu-patch
          build-args: QEMU_VERSION=${{ steps.ver.outputs.qemu }}
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=max

      - name: Extract QEMU binaries
        run: |
          docker create --name qemu-out podroid-qemu-patch /bin/true
          docker cp qemu-out:/opt/qemu-out/libqemu-system-aarch64.so ./libqemu-system-aarch64.so
          docker cp qemu-out:/opt/qemu-out/libslirp.so ./libslirp.so
          docker cp qemu-out:/opt/qemu-out/libpodroid-bridge.so ./libpodroid-bridge.so
          docker cp qemu-out:/opt/qemu-out/libpodroid-launcher.so ./libpodroid-launcher.so
          docker rm qemu-out
          ls -lh ./libqemu-system-aarch64.so ./libslirp.so ./libpodroid-bridge.so ./libpodroid-launcher.so

      # ══════════════════════════════════════════════════════════════════════
      # KERNEL: Custom kernel with USB maxpacket fix + all WiFi drivers =y
      # Developer's kernel-builder stage — cached after first run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched kernel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: kernel-builder
          load: true
          tags: podroid-kernel-patch
          build-args: KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          cache-from: type=gha,scope=kernel
          cache-to: type=gha,scope=kernel,mode=max

      - name: Extract kernel image
        run: |
          docker create --name kernel-out podroid-kernel-patch
          docker cp kernel-out:/output/vmlinuz-virt ./vmlinuz-virt
          docker rm kernel-out
          ls -lh ./vmlinuz-virt

      # ══════════════════════════════════════════════════════════════════════
      # PACKER: Developer's packer stage — kernel + rootfs → initrd.img
      # Runs on x86_64 (no emulation needed). This stage has the rootfs
      # contents available from rootfs-builder (arm64, built via QEMU emulation).
      # ══════════════════════════════════════════════════════════════════════
      - name: Build packer (initramfs)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: packer
          load: true
          tags: podroid-packer
          build-args: KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          cache-from: |
            type=gha,scope=kernel
            type=gha,scope=rootfs
            type=gha,scope=packer
          cache-to: type=gha,scope=packer,mode=max

      - name: Extract initramfs
        run: |
          docker create --name packer-out podroid-packer
          docker cp packer-out:/output/initrd.img ./initrd.img
          docker rm packer-out
          echo "✅ initramfs:"
          ls -lh ./initrd.img

      # ══════════════════════════════════════════════════════════════════════
      # ROOTFS SQUASHFS: Extract rootfs from packer image, build squashfs
      # The packer image contains the rootfs (from rootfs-builder).
      # We export it as tar, then use an x86_64 container with squashfs-tools.
      # No arm64 emulation needed — squashfs-tools is arch-independent.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build rootfs squashfs
        run: |
          # The packer image has rootfs at /rootfs/. Export and extract.
          docker create --name packer-rootfs podroid-packer
          mkdir -p /tmp/rootfs-export
          docker export packer-rootfs | tar -xf - -C /tmp/rootfs-export 2>/dev/null || true
          docker rm packer-rootfs

          # The rootfs content is at /tmp/rootfs-export/rootfs/
          # Build squashfs using an x86_64 container with squashfs-tools
          docker run --rm -v "/tmp/rootfs-export/rootfs:/rootfs:ro" -v "$(pwd):/out" \
            alpine:3.24 sh -c "
              apk add --no-cache squashfs-tools zstd >/dev/null 2>&1 &&
              cd /rootfs &&
              rm -rf proc sys dev run tmp boot output 2>/dev/null || true &&
              mksquashfs . /out/alpine-rootfs.squashfs \
                -comp zstd -Xcompression-level 19 -noappend
            "

          if [ -f alpine-rootfs.squashfs ]; then
            echo "✅ rootfs squashfs:"
            ls -lh alpine-rootfs.squashfs
          else
            echo "❌ Failed to build squashfs"
            exit 1
          fi

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: Replace ALL files in the all-core-file release
      # --clobber overwrites old files, keeps everything else intact
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload all binaries to all-core-file release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Replacing all files in all-core-file release..."

          gh release upload all-core-file \
            ./vmlinuz-virt \
            ./initrd.img \
            ./alpine-rootfs.squashfs \
            ./libqemu-system-aarch64.so \
            ./libslirp.so \
            ./libpodroid-bridge.so \
            ./libpodroid-launcher.so \
            --clobber

          echo ""
          echo "✅ Done. Release now has:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      - name: Cleanup
        if: always()
        run: docker rmi podroid-qemu-patch podroid-kernel-patch podroid-packer 2>/dev/null || true
