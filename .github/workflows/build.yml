name: Build & Update Release

# Builds everything the developer's build scripts produce:
#   - kernel + QEMU (main Dockerfile stages)
#   - rootfs squashfs (build-rootfs/Dockerfile.rootfs → build-rootfs.sh)
#   - initramfs (main Dockerfile packer stage)
# All outputs go to the all-core-file release via gh release upload --clobber.
# APK assets are built as release (R8 minified) by build-apk.yml.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'podroid_kernel.config'
      - 'gradle.properties'
      - 'build-tools/**'
      - 'build-rootfs/**'
      - 'init-yourxdemon'
      - 'podroid-bridge.c'
      - 'podroid-launcher.c'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: ver
        run: |
          echo "kernel=$(grep '^yourxdemonKernelVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "qemu=$(grep '^yourxdemonQemuVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "sysver=$(grep -E 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # QEMU: Cross-compiled patched QEMU binary
      # Developer's qemu-builder stage — cached after first run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qemu-builder
          load: true
          tags: podroid-qemu-patch
          build-args: QEMU_VERSION=${{ steps.ver.outputs.qemu }}
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=max

      - name: Extract QEMU binaries
        run: |
          docker create --name qemu-out podroid-qemu-patch /bin/true
          docker cp qemu-out:/opt/qemu-out/libqemu-system-aarch64.so ./libqemu-system-aarch64.so
          docker cp qemu-out:/opt/qemu-out/libslirp.so ./libslirp.so
          docker cp qemu-out:/opt/qemu-out/libpodroid-bridge.so ./libpodroid-bridge.so
          docker cp qemu-out:/opt/qemu-out/libpodroid-launcher.so ./libpodroid-launcher.so
          docker rm qemu-out
          ls -lh ./libqemu-system-aarch64.so ./libslirp.so ./libpodroid-bridge.so ./libpodroid-launcher.so

      # ══════════════════════════════════════════════════════════════════════
      # KERNEL: Custom kernel with USB maxpacket fix + all WiFi drivers =y
      # Developer's kernel-builder stage — cached after first run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched kernel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: kernel-builder
          load: true
          tags: podroid-kernel-patch
          build-args: KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          cache-from: type=gha,scope=kernel
          cache-to: type=gha,scope=kernel,mode=max

      - name: Extract kernel image
        run: |
          docker create --name kernel-out podroid-kernel-patch
          docker cp kernel-out:/output/vmlinuz-virt ./vmlinuz-virt
          docker rm kernel-out
          ls -lh ./vmlinuz-virt

      # ══════════════════════════════════════════════════════════════════════
      # ROOTFS: Developer's exact build — Dockerfile.rootfs → build-rootfs.sh
      # Context is build-rootfs/ directory (NOT project root).
      # This installs ALL packages (podman, docker, lxc, dropbear, tigervnc,
      # fonts, firmware, etc.) — same as ./build-all.sh rootfs.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build rootfs squashfs (developer's exact script)
        uses: docker/build-push-action@v6
        with:
          file: build-rootfs/Dockerfile.rootfs
          context: build-rootfs/
          load: true
          tags: podroid-rootfs
          build-args: SYSTEM_VERSION=${{ steps.ver.outputs.sysver }}
          cache-from: type=gha,scope=rootfs-full
          cache-to: type=gha,scope=rootfs-full,mode=max

      - name: Extract rootfs squashfs
        run: |
          docker create --name rootfs-out podroid-rootfs /bin/sh -c 'exit 0'
          docker cp rootfs-out:/yourxdemon-rootfs.squashfs ./yourxdemon-rootfs.squashfs
          docker rm rootfs-out
          echo "✅ rootfs squashfs:"
          ls -lh ./yourxdemon-rootfs.squashfs

      # ══════════════════════════════════════════════════════════════════════
      # INITRAMFS: Developer's packer stage — kernel + rootfs → initrd.img
      # The packer stage uses the main Dockerfile's rootfs-builder (minimal
      # packages for initramfs), NOT the full rootfs. This is correct —
      # the initramfs only needs boot-essential packages.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build initramfs (packer stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: packer
          load: true
          tags: podroid-packer
          build-args: KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          cache-from: |
            type=gha,scope=kernel
            type=gha,scope=rootfs
            type=gha,scope=packer
          cache-to: type=gha,scope=packer,mode=max

      - name: Extract initramfs
        run: |
          docker create --name packer-out podroid-packer
          docker cp packer-out:/output/initrd.img ./initrd.img
          docker rm packer-out
          echo "✅ initramfs:"
          ls -lh ./initrd.img

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: Replace ALL files in the all-core-file release
      # --clobber overwrites old files, keeps everything else intact
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload all binaries to all-core-file release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Replacing all files in all-core-file release..."

          gh release upload all-core-file \
            ./vmlinuz-virt \
            ./initrd.img \
            ./yourxdemon-rootfs.squashfs \
            ./libqemu-system-aarch64.so \
            ./libslirp.so \
            ./libpodroid-bridge.so \
            ./libpodroid-launcher.so \
            --clobber

          echo ""
          echo "✅ Done. Release now has:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      - name: Cleanup
        if: always()
        run: docker rmi podroid-qemu-patch podroid-kernel-patch podroid-rootfs podroid-packer 2>/dev/null || true
