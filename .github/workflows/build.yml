name: Build Patches & Update Release

# Only builds the 2 patched files:
#   1. libqemu-system-aarch64.so  (QEMU with USB speed quirk)
#   2. vmlinuz-virt               (kernel with maxpacket fix)
# Everything else (rootfs, initramfs, bridge, etc.) stays untouched.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'podroid_kernel.config'
      - 'gradle.properties'
      - 'build-tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: ver
        run: |
          echo "kernel=$(grep '^podroidKernelVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "qemu=$(grep '^podroidQemuVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # FILE 1: Patched QEMU binary
      # Builds the qemu-builder stage with Docker layer cache.
      # Only the host-libusb.c patch differs from upstream — everything else
      # (glib, pixman, libusb, etc.) is cached after first run.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qemu-builder
          load: true
          tags: podroid-qemu-patch
          build-args: QEMU_VERSION=${{ steps.ver.outputs.qemu }}
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=max

      - name: Extract QEMU binary
        run: |
          docker create --name qemu-out podroid-qemu-patch /bin/true
          docker cp qemu-out:/libqemu-system-aarch64.so ./libqemu-system-aarch64.so
          docker rm qemu-out
          ls -lh ./libqemu-system-aarch64.so

      # ══════════════════════════════════════════════════════════════════════
      # FILE 2: Patched guest kernel
      # Builds only the kernel-builder stage (kernel + USB maxpacket patch).
      # This is just the compressed kernel image, NOT the full initramfs.
      # ══════════════════════════════════════════════════════════════════════
      - name: Build patched kernel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: kernel-builder
          load: true
          tags: podroid-kernel-patch
          build-args: KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
          cache-from: type=gha,scope=kernel
          cache-to: type=gha,scope=kernel,mode=max

      - name: Extract kernel image
        run: |
          docker create --name kernel-out podroid-kernel-patch
          docker cp kernel-out:/output/vmlinuz-virt ./vmlinuz-virt
          docker rm kernel-out
          ls -lh ./vmlinuz-virt

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: Replace only these 2 files in the existing release
      # --clobber overwrites the old files, keeps everything else intact
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload patched binaries to all-core-file release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Replacing 2 patched files in all-core-file release..."

          gh release upload all-core-file \
            ./libqemu-system-aarch64.so \
            ./vmlinuz-virt \
            --clobber

          echo ""
          echo "✅ Done. Release now has:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      - name: Cleanup
        if: always()
        run: docker rmi podroid-qemu-patch podroid-kernel-patch 2>/dev/null || true
