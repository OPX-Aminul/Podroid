name: Build Full (All Binaries)

# Full build: kernel + QEMU + rootfs + initramfs — all artifacts.
# Updates the all-core-file release with EVERY binary, then triggers APK build.
# This is the "rebuild everything" workflow for firmware/driver/rootfs changes.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'podroid_kernel.config'
      - 'gradle.properties'
      - 'build-tools/**'
      - 'build-rootfs/**'
      - 'init-podroid'
      - 'podroid-bridge.c'
      - 'podroid-launcher.c'
      - '.github/workflows/build-full.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: ver
        run: |
          echo "kernel=$(grep '^podroidKernelVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "qemu=$(grep '^podroidQemuVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # BUILD: Full Dockerfile (all stages) — kernel + rootfs + initramfs + QEMU
      # ══════════════════════════════════════════════════════════════════════
      - name: Build full Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          load: true
          tags: podroid-full
          build-args: |
            KERNEL_VERSION=${{ steps.ver.outputs.kernel }}
            QEMU_VERSION=${{ steps.ver.outputs.qemu }}
          cache-from: |
            type=gha,scope=kernel
            type=gha,scope=qemu
            type=gha,scope=rootfs
            type=gha,scope=packer
          cache-to: |
            type=gha,scope=kernel,mode=max
            type=gha,scope=qemu,mode=max
            type=gha,scope=rootfs,mode=max
            type=gha,scope=packer,mode=max

      # ══════════════════════════════════════════════════════════════════════
      # EXTRACT: All binaries from the final stage
      # ══════════════════════════════════════════════════════════════════════
      - name: Extract all binaries
        run: |
          docker create --name full-out podroid-full /bin/true

          # Kernel
          docker cp full-out:/vmlinuz-virt ./vmlinuz-virt

          # Initramfs
          docker cp full-out:/initrd.img ./initrd.img

          # QEMU + helpers
          docker cp full-out:/libqemu-system-aarch64.so ./libqemu-system-aarch64.so
          docker cp full-out:/libslirp.so ./libslirp.so
          docker cp full-out:/libpodroid-bridge.so ./libpodroid-bridge.so
          docker cp full-out:/libpodroid-launcher.so ./libpodroid-launcher.so

          docker rm full-out

          echo "=== Extracted binaries ==="
          ls -lh ./vmlinuz-virt ./initrd.img \
                 ./libqemu-system-aarch64.so ./libslirp.so \
                 ./libpodroid-bridge.so ./libpodroid-launcher.so

      # ══════════════════════════════════════════════════════════════════════
      # BUILD ROOTFS: Also extract the squashfs for APK build
      # ══════════════════════════════════════════════════════════════════════
      - name: Build rootfs squashfs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rootfs-builder
          load: true
          tags: podroid-rootfs
          cache-from: type=gha,scope=rootfs

      - name: Extract squashfs
        run: |
          # Build rootfs squashfs from the rootfs-builder output
          docker run --rm -v "$(pwd)/out-rootfs:/out" podroid-rootfs sh -c "
            cd / && tar cf - --exclude=proc --exclude=sys --exclude=dev --exclude=run --exclude=tmp --exclude=boot . 2>/dev/null \
            | mksquashfs - /out/alpine-rootfs.squashfs -comp zstd -Xcompression-level 19 -noappend 2>/dev/null
          "
          if [ -f out-rootfs/alpine-rootfs.squashfs ]; then
            cp out-rootfs/alpine-rootfs.squashfs ./alpine-rootfs.squashfs
            ls -lh ./alpine-rootfs.squashfs
          else
            echo "❌ Failed to build squashfs"
            exit 1
          fi

      # ══════════════════════════════════════════════════════════════════════
      # UPLOAD: Replace ALL files in the all-core-file release
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload all binaries to all-core-file release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Replacing ALL files in all-core-file release..."

          gh release upload all-core-file \
            ./vmlinuz-virt \
            ./initrd.img \
            ./alpine-rootfs.squashfs \
            ./libqemu-system-aarch64.so \
            ./libslirp.so \
            ./libpodroid-bridge.so \
            ./libpodroid-launcher.so \
            --clobber

          echo ""
          echo "✅ Done. Release now has:"
          gh release view all-core-file --json assets \
            --jq '.assets[] | "  \(.name) (\(.size / 1048576 * 100 | round / 100) MB)"'

      - name: Cleanup
        if: always()
        run: docker rmi podroid-full podroid-rootfs 2>/dev/null || true
